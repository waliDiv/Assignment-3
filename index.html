<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sample Page</title>
    <style>
        /* Skip link */
        .skip-link {
            position: absolute;
            left: -999px;
            top: -999px;
            background: #000;
            color: #fff;
            padding: 10px;
            z-index: 100;
        }
        .skip-link:focus {
            left: 10px;
            top: 10px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #4CAF50;
            padding: 15px;
            border-radius: 8px;
        }
        nav a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 8px 12px;
            transition: transform 0.3s, color 0.3s;
        }
        nav a:hover {
            color: #FFD700;
            transform: scale(1.1);
        }

        /* Images */
        img {
            border: 5px solid #333;
            padding: 5px;
            border-radius: 15px;
            max-width: 100%;
        }

        /* Grid layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        /* Flex layout */
        .flex-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* nth-child example */
        .flex-container img:nth-child(even) {
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to Main Content</a>

    <nav>
        <a href="#">Home</a>
        <a href="#">Gallery</a>
        <a href="#">About</a>
    </nav>

    <main id="main-content">
        <h1>Welcome to My Sample Page</h1>
        <p>This page demonstrates HTML and CSS with images, grid, flex, and hover effects.</p>

        <h2>Grid Example (2 columns)</h2>
        <div class="grid-container">
            <img src="https://via.placeholder.com/150/FF0000/FFFFFF?text=Image1" alt="Image 1">
            <img src="https://via.placeholder.com/150/00FF00/FFFFFF?text=Image2" alt="Image 2">
            <img src="https://via.placeholder.com/150/0000FF/FFFFFF?text=Image3" alt="Image 3">
            <img src="https://via.placeholder.com/150/FFFF00/000000?text=Image4" alt="Image 4">
        </div>

        <h2>Flex Example</h2>
        <div class="flex-container">
            <img src="https://via.placeholder.com/100/FF00FF/FFFFFF?text=A" alt="Image A">
            <img src="https://via.placeholder.com/100/00FFFF/FFFFFF?text=B" alt="Image B">
            <img src="https://via.placeholder.com/100/FFA500/FFFFFF?text=C" alt="Image C">
        </div>
    </main>
</body>
</html>
